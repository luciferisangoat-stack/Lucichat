<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuciChat — WebLLM Diagnostic</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px;
  background:#0b1020;
  color:#eef2ff;
  font-family:system-ui,-apple-system,sans-serif;
}

h1{
  margin-top:0;
  font-size:24px;
}

.card{
  background:#151c31;
  border:1px solid #2a3555;
  border-radius:14px;
  padding:16px;
  margin:14px 0;
}

.test{
  padding:14px;
  margin:10px 0;
  border-radius:10px;
  background:#0e1528;
  border:1px solid #293653;
}

.name{
  font-weight:700;
  margin-bottom:6px;
}

.status{
  font-size:14px;
  word-break:break-word;
}

.ok{
  color:#72e6a0;
}

.bad{
  color:#ff7777;
}

.warn{
  color:#ffd166;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#5865f2;
  color:white;
  font-size:16px;
  font-weight:700;
  margin-top:8px;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#080d19;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  overflow:auto;
}
</style>
</head>

<body>

<h1>🔧 LuciChat WebLLM Diagnostic</h1>

<div class="card">
  <div>
    This page checks the things LuciChat needs before loading the AI.
  </div>

  <button onclick="runTests()">Run Tests Again</button>
</div>

<div id="tests"></div>

<div class="card">
  <h3>Technical information</h3>
  <pre id="info">Collecting...</pre>
</div>

<script>

const MODEL =
  "SmolLM2-360M-Instruct-q4f32_1-MLC";

const HF_MODEL =
  "https://huggingface.co/mlc-ai/" + MODEL;

const WEBLLM_CDN =
  "https://esm.run/@mlc-ai/web-llm@0.2.85";

const tests = document.getElementById("tests");

function addTest(name, status, type="warn"){
  const div = document.createElement("div");
  div.className = "test";

  div.innerHTML = `
    <div class="name">${name}</div>
    <div class="status ${type}">${status}</div>
  `;

  tests.appendChild(div);
}

async function testFetch(url, name){

  addTest(name, "⏳ Testing...");

  try{

    const response = await fetch(url, {
      method:"GET",
      cache:"no-store"
    });

    if(response.ok){

      const text = await response.text();

      addTest(
        name,
        "✅ SUCCESS — HTTP " +
        response.status +
        " — " +
        text.length +
        " bytes received",
        "ok"
      );

      return true;

    }else{

      addTest(
        name,
        "❌ FAILED — HTTP " +
        response.status +
        " " +
        response.statusText,
        "bad"
      );

      return false;
    }

  }catch(error){

    addTest(
      name,
      "❌ FETCH ERROR — " +
      error.name +
      ": " +
      error.message,
      "bad"
    );

    return false;
  }
}

async function testWebGPU(){

  addTest("WebGPU", "⏳ Testing...");

  if(!("gpu" in navigator)){

    addTest(
      "WebGPU",
      "❌ navigator.gpu is NOT available.",
      "bad"
    );

    return false;
  }

  try{

    const adapter =
      await navigator.gpu.requestAdapter();

    if(!adapter){

      addTest(
        "WebGPU",
        "❌ WebGPU exists, but no GPU adapter was returned.",
        "bad"
      );

      return false;
    }

    addTest(
      "WebGPU",
      "✅ WebGPU adapter found.",
      "ok"
    );

    return true;

  }catch(error){

    addTest(
      "WebGPU",
      "❌ WebGPU ERROR — " +
      error.name +
      ": " +
      error.message,
      "bad"
    );

    return false;
  }
}

async function testWebLLMImport(){

  addTest(
    "WebLLM JavaScript CDN",
    "⏳ Importing WebLLM..."
  );

  try{

    const module =
      await import(WEBLLM_CDN);

    if(module){

      addTest(
        "WebLLM JavaScript CDN",
        "✅ WebLLM imported successfully.",
        "ok"
      );

      return true;
    }

  }catch(error){

    addTest(
      "WebLLM JavaScript CDN",
      "❌ WebLLM import failed — " +
      error.name +
      ": " +
      error.message,
      "bad"
    );

    return false;
  }

  return false;
}

async function runTests(){

  tests.innerHTML = "";

  addTest(
    "Secure Context",
    window.isSecureContext
      ? "✅ HTTPS / secure context detected."
      : "❌ This page is NOT running in a secure context.",
    window.isSecureContext ? "ok" : "bad"
  );

  await testWebGPU();

  await testFetch(
    "https://esm.run/",
    "ESM CDN connection"
  );

  await testWebLLMImport();

  await testFetch(
    HF_MODEL,
    "Hugging Face model repository"
  );

  await testFetch(
    "https://huggingface.co/mlc-ai/" +
    MODEL +
    "/resolve/main/mlc-chat-config.json",
    "Model configuration file"
  );

  await testFetch(
    "https://huggingface.co/mlc-ai/" +
    MODEL +
    "/resolve/main/tokenizer.json",
    "Tokenizer file"
  );

  addTest(
    "Model ID",
    "ℹ️ " + MODEL,
    "warn"
  );

  addTest(
    "Final result",
    "Tests complete. Send me a screenshot of this page.",
    "warn"
  );

  document.getElementById("info").textContent =
`Model:
${MODEL}

WebLLM:
0.2.85

Secure Context:
${window.isSecureContext}

WebGPU:
${"gpu" in navigator}

Browser:
${navigator.userAgent}

Platform:
${navigator.platform}

Online:
${navigator.onLine}

Language:
${navigator.language}`;
}

runTests();

</script>

</body>
</html>
