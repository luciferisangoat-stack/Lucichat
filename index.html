<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>LuciChat</title>
<style>
*{box-sizing:border-box}:root{--panel:#101010;--panel2:#171010;--line:#3a1b20;--text:#f5f5f5;--muted:#a59a9c;--accent:#e3132a}
body{margin:0;background:radial-gradient(circle at 50% -10%,#3b0b12 0,#120407 30%,#050505 62%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.app{width:min(100%,980px);margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:18px 16px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:rgba(5,5,5,.95);backdrop-filter:blur(12px);z-index:5}.brand{display:flex;align-items:center;gap:11px}.logo{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#050505;border:1px solid #8d1420;color:#ef182e;font-family:Georgia,serif;font-size:31px;font-weight:900;box-shadow:0 0 18px rgba(227,19,42,.38),inset 0 0 12px rgba(139,13,24,.25);text-shadow:0 0 12px #ff243b}.title{font-size:21px;font-weight:900}.tag{font-size:12px;color:var(--muted);margin-top:2px}.small{padding:9px 12px;font-size:13px;background:var(--panel2);border:1px solid var(--line);color:white;border-radius:14px;font-weight:800}
main{flex:1;padding:18px 14px 175px}.welcome{text-align:center;margin:45px auto 25px;max-width:620px}.welcome h1{font-size:32px;margin:0 0 9px}.welcome p{color:var(--muted);margin:0;line-height:1.6}#chat{display:flex;flex-direction:column;gap:12px}.msg{max-width:82%;padding:13px 15px;border:1px solid var(--line);border-radius:17px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:#351018;border-bottom-right-radius:5px}.msg.ai{align-self:flex-start;background:var(--panel);border-bottom-left-radius:5px}.who{font-size:11px;color:#c1afb2;margin-bottom:5px;font-weight:700}.aiimg{display:block;width:min(100%,620px);border-radius:14px;border:1px solid #54202a;margin-top:8px}.notice{margin:20px auto;max-width:650px;color:var(--muted);font-size:12px;line-height:1.5;text-align:center}
.composer{position:fixed;bottom:0;left:0;right:0;padding:12px 14px max(12px,env(safe-area-inset-bottom));background:rgba(5,5,5,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line)}.compose-inner{width:min(100%,950px);margin:auto;display:flex;gap:8px;align-items:flex-end}textarea{flex:1;min-height:48px;max-height:150px;resize:none;border:1px solid #522029;border-radius:16px;background:#0e0e0e;color:var(--text);padding:13px 14px;font:inherit;outline:none}textarea:focus{border-color:var(--accent);box-shadow:0 0 14px rgba(227,19,42,.14)}button{border:0;border-radius:14px;padding:13px 15px;background:var(--accent);color:white;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:default}.voice,.google,.imagebtn{width:46px;height:46px;padding:0;border-radius:50%;background:#171010;border:1px solid #572029;font-size:19px}.voice{font-size:0;position:relative;background:#3b080e;border:2px solid #79121d}.voice:after{content:"";width:13px;height:13px;background:#a51d2b;border-radius:50%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.voice.active{background:#68101a;border-color:#d3293a;box-shadow:0 0 20px rgba(210,30,45,.7)}.google:hover,.imagebtn:hover{border-color:#a51d2b;background:#241014}.status{text-align:center;color:var(--muted);font-size:12px;margin-top:8px;min-height:18px}
@media(max-width:600px){header{padding:13px 12px}.logo{width:40px;height:40px;font-size:28px}.title{font-size:19px}main{padding:10px 10px 175px}.welcome{margin:35px auto 20px}.welcome h1{font-size:27px}.msg{max-width:90%}.composer{padding-left:8px;padding-right:8px}.compose-inner{gap:5px}button{padding:12px 13px}.voice,.google,.imagebtn{width:44px;height:44px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">⛧</div><div><div class="title">LuciChat</div><div class="tag">Your AI assistant • phone + computer</div></div></div><button class="small" id="clearBtn">Clear</button></header>
<main><section class="welcome" id="welcome"><h1>Welcome to LuciChat ⛧</h1><p>Chat with LuciChat, search Google, use your voice, or ask it to generate an image.</p></section><div id="chat"></div><div class="notice">AI responses use public AI services. Don't put passwords, addresses, or other private information in your messages.</div></main>
<div class="composer"><div class="compose-inner"><button class="google" id="googleBtn" title="Search Google" aria-label="Search Google">G</button><button class="imagebtn" id="imageBtn" title="Generate image" aria-label="Generate image">🎨</button><button class="voice" id="voiceBtn" title="Voice input" aria-label="Voice input">🎤</button><textarea id="input" rows="1" placeholder="Message LuciChat..." aria-label="Message LuciChat"></textarea><button id="send">Send</button></div><div class="status" id="status"></div></div>
</div>
<script>
const TEXT_ENDPOINT='https://text.pollinations.ai/',TEXT_MODEL='openai-fast',IMAGE_ENDPOINT='https://image.pollinations.ai/prompt/',input=document.getElementById('input'),send=document.getElementById('send'),chat=document.getElementById('chat'),welcome=document.getElementById('welcome'),status=document.getElementById('status'),clearBtn=document.getElementById('clearBtn'),voiceBtn=document.getElementById('voiceBtn'),googleBtn=document.getElementById('googleBtn'),imageBtn=document.getElementById('imageBtn');
let messages=[];try{messages=JSON.parse(localStorage.getItem('lucichat_messages')||'[]')}catch(e){messages=[]}
function save(){localStorage.setItem('lucichat_messages',JSON.stringify(messages))}
function render(){chat.innerHTML='';welcome.style.display=messages.length?'none':'block';for(const m of messages){const box=document.createElement('div');box.className='msg '+(m.role==='user'?'user':'ai');const who=document.createElement('div');who.className='who';who.textContent=m.role==='user'?'You':'LuciChat';box.append(who);if(m.image){const p=document.createElement('div');p.textContent=m.content||'Generated image';box.append(p);const img=document.createElement('img');img.className='aiimg';img.loading='lazy';img.src=m.image;img.alt=m.content||'Generated image';box.append(img)}else{const text=document.createElement('div');text.textContent=m.content;box.append(text)}chat.appendChild(box)}window.scrollTo(0,document.body.scrollHeight)}
function add(role,content,extra={}){messages.push({role,content,...extra});save();render()}
function buildPrompt(userText){const recent=messages.slice(-8).map(m=>(m.role==='user'?'User: ':'LuciChat: ')+m.content).join('\n');return 'You are LuciChat, a friendly helpful AI assistant. Be clear, natural, concise, and safe. Continue the conversation using the recent messages below.\n\n'+recent+'\nUser: '+userText+'\nLuciChat:'}
function looksLikeImageRequest(t){return /\b(generate|create|draw|make|show|design)\b.{0,35}\b(image|picture|photo|art|drawing|portrait|wallpaper|logo)\b/i.test(t)||/\b(image|picture|photo|art|drawing|portrait|wallpaper)\b.{0,25}\b(of|for)\b/i.test(t)}
function imagePrompt(t){return t.replace(/\b(please|can you|could you|generate|create|draw|make|show me|an image|a picture|a photo)\b/gi,' ').replace(/\s+/g,' ').trim()||'a friendly dog, detailed digital art'}
async function generateImage(prompt){const clean=imagePrompt(prompt);const url=IMAGE_ENDPOINT+encodeURIComponent(clean)+'?model=flux&width=768&height=768&nologo=true';add('assistant','Generated image: '+clean,{image:url});status.textContent='Image generated ✓';setTimeout(()=>status.textContent='',1600)}
async function sendMessage(){const text=input.value.trim();if(!text||send.disabled)return;input.value='';input.style.height='auto';add('user',text);send.disabled=true;status.textContent='Working...';try{if(looksLikeImageRequest(text)){await generateImage(text);return}const temp={role:'assistant',content:''};messages.push(temp);render();const recent=messages.slice(-9,-1).map(m=>(m.role==='user'?'User: ':'LuciChat: ')+m.content).join('\n');const prompt='You are LuciChat, a friendly helpful AI assistant. Be clear, natural, concise, and safe.\n\n'+recent+'\nUser: '+text+'\nLuciChat:';const url=TEXT_ENDPOINT+encodeURIComponent(prompt)+'?model='+encodeURIComponent(TEXT_MODEL);const res=await fetch(url,{headers:{Accept:'text/plain'}});if(!res.ok)throw new Error('AI service returned '+res.status);temp.content=(await res.text()).trim()||'I did not get a response. Try again.';save();render();status.textContent=''}catch(err){if(messages.at(-1)?.role==='assistant'&&!messages.at(-1).content)messages.pop();save();render();status.textContent='Could not generate that right now. Try again.';console.error(err)}finally{send.disabled=false;input.focus()}}
function googleSearch(){const q=input.value.trim()||messages.filter(m=>m.role==='user').slice(-1)[0]?.content||'';if(!q){status.textContent='Type something to search Google.';input.focus();return}window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank','noopener,noreferrer')}
googleBtn.addEventListener('click',googleSearch);imageBtn.addEventListener('click',()=>{const q=input.value.trim();if(!q){status.textContent='Type what you want to generate first.';input.focus();return}generateImage(q);input.value='';input.style.height='auto'});send.addEventListener('click',sendMessage);input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});clearBtn.addEventListener('click',()=>{messages=[];save();render();status.textContent='Chat cleared.';setTimeout(()=>status.textContent='',1500);input.focus()});
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=null;if(SpeechRecognition){recognition=new SpeechRecognition();recognition.lang='en-US';recognition.interimResults=false;recognition.continuous=false;recognition.onstart=()=>{voiceBtn.classList.add('active');status.textContent='Listening...'};recognition.onresult=e=>{input.value=e.results[0][0].transcript;input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px';status.textContent='Voice captured ✓';input.focus();setTimeout(()=>status.textContent='',1200)};recognition.onerror=e=>{status.textContent=e.error==='not-allowed'?'Microphone permission was blocked.':'Voice input failed. Try again.'};recognition.onend=()=>voiceBtn.classList.remove('active');voiceBtn.addEventListener('click',()=>{try{recognition.start()}catch(e){recognition.stop()}})}else{voiceBtn.disabled=true;voiceBtn.title='Voice input is not supported in this browser'}
render();input.focus();
</script>
</body>
</html>
