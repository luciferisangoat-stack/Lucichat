<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuciChat — Local AI</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  background:#0b1020;
  color:#eef2ff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  padding:16px;
  border-bottom:1px solid #26304a;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-size:20px;
  font-weight:700;
}

.subtitle{
  font-size:12px;
  color:#8994b3;
  margin-top:3px;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  background:#5865f2;
  color:white;
  font-weight:600;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.creator-btn{
  background:#1c2540;
}

#status{
  padding:10px 16px;
  background:#10172b;
  border-bottom:1px solid #26304a;
  color:#aeb8d5;
  font-size:13px;
}

#chat{
  min-height:calc(100vh - 180px);
  padding:18px;
  max-width:900px;
  margin:auto;
}

.message{
  display:flex;
  margin:12px 0;
}

.bubble{
  max-width:85%;
  padding:12px 14px;
  border-radius:15px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user{
  justify-content:flex-end;
}

.user .bubble{
  background:#5865f2;
  border-bottom-right-radius:4px;
}

.assistant .bubble{
  background:#171f36;
  border:1px solid #293451;
  border-bottom-left-radius:4px;
}

.system{
  justify-content:center;
}

.system .bubble{
  max-width:95%;
  color:#aeb8d5;
  background:#11182b;
  border:1px solid #222d49;
  text-align:center;
}

.error{
  color:#ffb4b4;
  background:#351a22;
  border:1px solid #71313e;
  padding:12px;
  border-radius:12px;
  margin:12px 0;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.progress{
  color:#aeb8d5;
  font-size:13px;
  margin-top:8px;
}

.composer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#0b1020;
  border-top:1px solid #26304a;
  padding:12px;
}

.composer-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  gap:8px;
}

#input{
  flex:1;
  min-width:0;
  background:#121a30;
  border:1px solid #2b3858;
  color:#eef2ff;
  border-radius:12px;
  padding:12px;
  outline:none;
  font-size:16px;
}

#input:focus{
  border-color:#5865f2;
}

#send{
  min-width:75px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10;
}

.modal-box{
  width:100%;
  max-width:360px;
  background:#121a30;
  border:1px solid #2b3858;
  border-radius:16px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.modal-box h2{
  margin-top:0;
}

#pin{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #2b3858;
  background:#0b1020;
  color:white;
  font-size:18px;
  outline:none;
}

.modal-buttons{
  display:flex;
  gap:8px;
}

.modal-buttons button{
  flex:1;
}

.close-btn{
  background:#293451;
}

.small{
  font-size:12px;
  color:#8994b3;
  margin-top:10px;
}

@media(max-width:600px){
  header{
    padding:12px;
  }

  .logo{
    font-size:18px;
  }

  #chat{
    padding:14px;
    padding-bottom:100px;
  }

  .bubble{
    max-width:92%;
  }

  .composer{
    padding:8px;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <div class="logo">🤖 LuciChat</div>
    <div class="subtitle">Your personal AI assistant</div>
  </div>

  <button class="creator-btn" id="creatorBtn">
    Creator
  </button>
</header>

<div id="status">
  Starting LuciChat...
</div>

<main id="chat">

  <div class="message assistant">
    <div class="bubble">
      👋 Hi! I'm LuciChat.

      I'm trying to start my local AI engine. This may take a little while the first time because the AI model has to download.
    </div>
  </div>

  <div id="progress" class="progress"></div>

</main>

<div class="composer">
  <div class="composer-inner">

    <input
      id="input"
      type="text"
      placeholder="Waiting for AI..."
      autocomplete="off"
      disabled
    >

    <button id="send" disabled>
      Send
    </button>

  </div>
</div>

<div class="modal" id="creatorModal">

  <div class="modal-box">

    <h2>🔐 Creator Mode</h2>

    <p>Enter the creator PIN.</p>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      placeholder="PIN"
    >

    <div class="modal-buttons">

      <button class="close-btn" id="closeCreator">
        Cancel
      </button>

      <button id="unlockCreator">
        Unlock
      </button>

    </div>

    <div class="small">
      Creator mode is stored only in this browser.
    </div>

  </div>

</div>

<script type="module">

const MODEL =
  "SmolLM2-360M-Instruct-q4f32_1-MLC";

const CREATOR_PIN = "1234";

let engine = null;
let starting = false;
let startupFinished = false;

const messages = [
  {
    role:"system",
    content:
      "You are LuciChat, a friendly personal AI assistant. Be helpful, concise, honest, and safe."
  }
];

const statusEl =
  document.getElementById("status");

const progressEl =
  document.getElementById("progress");

const chatEl =
  document.getElementById("chat");

const inputEl =
  document.getElementById("input");

const sendBtn =
  document.getElementById("send");

const creatorBtn =
  document.getElementById("creatorBtn");

const creatorModal =
  document.getElementById("creatorModal");

const closeCreator =
  document.getElementById("closeCreator");

const unlockCreator =
  document.getElementById("unlockCreator");

const pinEl =
  document.getElementById("pin");


function addMessage(role,text){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + role;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent = text;

  wrapper.appendChild(bubble);

  chatEl.appendChild(wrapper);

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

  return bubble;
}


function showError(error){

  const old =
    document.getElementById("startupError");

  if(old){
    old.remove();
  }

  const box =
    document.createElement("div");

  box.id =
    "startupError";

  box.className =
    "error";

  const message =
    error && error.message
      ? error.message
      : String(error);

  box.textContent =
`AI startup error

${message}

Debug:
Model:
${MODEL}

Secure context:
${window.isSecureContext}

WebGPU:
${!!navigator.gpu}

Browser:
${navigator.userAgent}`;

  chatEl.appendChild(box);
}


async function checkUrl(url,label){

  progressEl.textContent =
    "Checking " + label + "...";

  try{

    const response =
      await fetch(url,{
        method:"GET",
        headers:{
          "Range":"bytes=0-0"
        },
        cache:"no-store"
      });

    if(!response.ok){

      throw new Error(
        label +
        " returned HTTP " +
        response.status
      );

    }

    return true;

  }catch(error){

    throw new Error(
      label +
      " could not be reached.\n\n" +
      "URL:\n" +
      url +
      "\n\n" +
      "Error:\n" +
      (error?.message || error)
    );

  }
}


async function startAI(){

  if(starting) return;

  if(startupFinished) return;

  starting = true;

  sendBtn.disabled = true;

  inputEl.disabled = true;

  statusEl.textContent =
    "Checking your device...";

  progressEl.textContent = "";


  try{

    if(!window.isSecureContext){

      throw new Error(
        "LuciChat needs HTTPS to use WebGPU."
      );

    }


    if(!navigator.gpu){

      throw new Error(
        "WebGPU is not available in this browser."
      );

    }


    statusEl.textContent =
      "Checking WebGPU...";


    const adapter =
      await navigator.gpu.requestAdapter();


    if(!adapter){

      throw new Error(
        "WebGPU was detected, but no compatible GPU adapter was found."
      );

    }


    statusEl.textContent =
      "Loading WebLLM...";


    let WebLLM;


    try{

      WebLLM =
        await import(
          "https://esm.run/@mlc-ai/web-llm"
        );

    }catch(e){

      throw new Error(
        "Could not download the WebLLM library.\n\n" +
        (e?.message || e)
      );

    }


    const modelList =
      WebLLM.prebuiltAppConfig?.model_list || [];


    const modelInfo =
      modelList.find(
        m => m.model_id === MODEL
      );


    if(!modelInfo){

      throw new Error(
        "The selected model was not found in this WebLLM version:\n\n" +
        MODEL
      );

    }


    /*
      NEW DIAGNOSTICS

      We check the model's small config file
      and the WebGPU WASM library before asking
      WebLLM to download the full model.
    */


    const modelBase =
      modelInfo.model.replace(/\/$/,"");


    const configUrl =
      modelBase +
      "/mlc-chat-config.json";


    statusEl.textContent =
      "Checking AI model files...";


    await checkUrl(
      configUrl,
      "AI model configuration"
    );


    statusEl.textContent =
      "Checking WebGPU library...";


    await checkUrl(
      modelInfo.model_lib,
      "WebGPU model library"
    );


    statusEl.textContent =
      "Downloading local AI model...";


    progressEl.textContent =
      "The first download can take a while. Please keep this page open.";


    engine =
      await WebLLM.CreateMLCEngine(
        MODEL,
        {

          initProgressCallback:
            function(progress){

              if(!progress) return;


              if(progress.text){

                progressEl.textContent =
                  progress.text;

              }else if(
                typeof progress.progress === "number"
              ){

                const percent =
                  Math.round(
                    progress.progress * 100
                  );

                progressEl.textContent =
                  "Downloading AI model: " +
                  percent +
                  "%";

              }

            },

          logLevel:"ERROR"

        }
      );


    startupFinished = true;

    starting = false;

    statusEl.textContent =
      "🟢 LuciChat is ready";

    progressEl.textContent =
      "Local AI is running on this device.";

    inputEl.disabled = false;

    sendBtn.disabled = false;

    inputEl.placeholder =
      "Type a message...";

    inputEl.focus();


  }catch(error){

    starting = false;

    statusEl.textContent =
      "🔴 LuciChat could not start";

    progressEl.textContent =
      "Tap Retry after checking your connection.";

    showError(error);


    const retry =
      document.createElement("button");

    retry.textContent =
      "Retry";

    retry.style.marginTop =
      "10px";

    retry.onclick =
      function(){

        retry.remove();

        startAI();

      };


    chatEl.appendChild(retry);

  }

}


async function sendMessage(){

  const text =
    inputEl.value.trim();


  if(!text) return;


  if(!engine){

    addMessage(
      "system",
      "The AI is still starting. Please wait."
    );

    return;

  }


  addMessage(
    "user",
    text
  );


  inputEl.value = "";

  inputEl.disabled = true;

  sendBtn.disabled = true;


  messages.push({
    role:"user",
    content:text
  });


  const thinking =
    addMessage(
      "assistant",
      "Thinking..."
    );


  try{

    const reply =
      await engine.chat.completions.create({

        messages:messages,

        temperature:0.7,

        max_tokens:300

      });


    const answer =
      reply?.choices?.[0]?.message?.content ||
      "I didn't get a response.";


    thinking.textContent =
      answer;


    messages.push({
      role:"assistant",
      content:answer
    });


  }catch(error){

    console.error(error);

    thinking.textContent =
      "Sorry, something went wrong while generating the response.";

  }


  inputEl.disabled = false;

  sendBtn.disabled = false;

  inputEl.focus();

}


sendBtn.addEventListener(
  "click",
  sendMessage
);


inputEl.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


creatorBtn.addEventListener(
  "click",
  function(){

    creatorModal.style.display =
      "flex";

    pinEl.value = "";

    pinEl.focus();

  }
);


closeCreator.addEventListener(
  "click",
  function(){

    creatorModal.style.display =
      "none";

  }
);


creatorModal.addEventListener(
  "click",
  function(event){

    if(event.target === creatorModal){

      creatorModal.style.display =
        "none";

    }

  }
);


unlockCreator.addEventListener(
  "click",
  function(){

    if(pinEl.value === CREATOR_PIN){

      localStorage.setItem(
        "luciCreator",
        "true"
      );

      creatorBtn.textContent =
        "Creator ✓";

      creatorModal.style.display =
        "none";

      addMessage(
        "system",
        "Creator mode unlocked."
      );

    }else{

      pinEl.value = "";

      pinEl.placeholder =
        "Incorrect PIN";

    }

  }
);


if(
  localStorage.getItem("luciCreator") === "true"
){

  creatorBtn.textContent =
    "Creator ✓";

}


startAI();

</script>

</body>
</html>
