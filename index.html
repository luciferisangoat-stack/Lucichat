<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>LuciChat</title>
<style>
*{box-sizing:border-box}:root{--panel:#101010;--panel2:#171717;--line:#2b2224;--text:#f5f5f5;--muted:#9b9b9b;--accent:#ff2635}
body{margin:0;background:radial-gradient(circle at top,#210b0e 0,#080808 38%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.app{width:min(100%,980px);margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:18px 16px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:rgba(8,8,8,.94);backdrop-filter:blur(12px);z-index:5}.brand{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;background:#050505;border:1px solid #641017;color:#ff2635;box-shadow:0 0 16px rgba(255,25,40,.28);font-family:Georgia,serif;font-size:30px;font-weight:900;font-style:italic;text-shadow:0 0 10px #ff2635}.logo:before,.logo:after{content:"";position:absolute;top:2px;width:13px;height:15px;border:3px solid #ff2635;border-bottom:0;border-radius:80% 20% 0 0;transform:rotate(-28deg)}.logo:before{left:5px}.logo:after{right:5px;transform:rotate(28deg)}.title{font-size:21px;font-weight:800}.tag{font-size:12px;color:var(--muted);margin-top:2px}.actions{display:flex;gap:8px}.small{width:auto;padding:9px 12px;font-size:13px;background:var(--panel2);border:1px solid var(--line);color:white}
main{flex:1;padding:18px 14px 150px}.welcome{text-align:center;margin:45px auto 25px;max-width:620px}.welcome h1{font-size:32px;margin:0 0 9px}.welcome p{color:var(--muted);margin:0;line-height:1.6}#chat{display:flex;flex-direction:column;gap:12px}.msg{max-width:82%;padding:13px 15px;border:1px solid var(--line);border-radius:17px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:#321217;border-bottom-right-radius:5px}.msg.ai{align-self:flex-start;background:var(--panel);border-bottom-left-radius:5px}.who{font-size:11px;color:#b5b5b5;margin-bottom:5px;font-weight:700}.notice{margin:20px auto;max-width:650px;color:var(--muted);font-size:12px;line-height:1.5;text-align:center}
.composer{position:fixed;bottom:0;left:0;right:0;padding:12px 14px max(12px,env(safe-area-inset-bottom));background:rgba(8,8,8,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line)}.compose-inner{width:min(100%,950px);margin:auto;display:flex;gap:9px;align-items:flex-end}textarea{flex:1;min-height:48px;max-height:150px;resize:none;border:1px solid #4b2024;border-radius:16px;background:#101010;color:var(--text);padding:13px 14px;font:inherit;outline:none}textarea:focus{border-color:var(--accent);box-shadow:0 0 10px rgba(255,38,53,.12)}button{border:0;border-radius:14px;padding:13px 17px;background:var(--accent);color:white;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.5;cursor:default}.voice{width:48px;height:48px;padding:0;border-radius:50%;background:#42090e;border:2px solid #79151d;font-size:0;position:relative;box-shadow:0 0 10px rgba(145,15,25,.3)}.voice:after{content:"";width:13px;height:13px;background:#9f202b;border-radius:50%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.voice.active{background:#70131c;border-color:#c12835;box-shadow:0 0 18px rgba(210,30,45,.65)}.status{text-align:center;color:var(--muted);font-size:12px;margin-top:8px;min-height:18px}
@media(max-width:600px){header{padding:13px 12px}.logo{width:40px;height:40px}.title{font-size:19px}.small{padding:8px 10px}main{padding:10px 10px 145px}.welcome{margin:35px auto 20px}.welcome h1{font-size:27px}.msg{max-width:90%}.composer{padding-left:9px;padding-right:9px}.compose-inner{gap:7px}button{padding:12px 14px}.voice{width:46px;height:46px}}
</style>
</head>
<body>
<div class="app"><header><div class="brand"><div class="logo">L</div><div><div class="title">LuciChat</div><div class="tag">Your AI assistant • phone + computer</div></div></div><div class="actions"><button class="small" id="clearBtn">Clear</button></div></header><main><section class="welcome" id="welcome"><h1>Hey 👋 I'm LuciChat</h1><p>Ask me a question, get help with homework, brainstorm ideas, or just chat.</p></section><div id="chat"></div><div class="notice">AI responses use a public AI service. Don't put passwords, addresses, or other private information in your messages.</div></main><div class="composer"><div class="compose-inner"><button class="voice" id="voiceBtn" title="Voice input" aria-label="Voice input">🎤</button><textarea id="input" rows="1" placeholder="Message LuciChat..." aria-label="Message LuciChat"></textarea><button id="send">Send</button></div><div class="status" id="status"></div></div></div>
<script>
const ENDPOINT='https://text.pollinations.ai/',MODEL='openai-fast',input=document.getElementById('input'),send=document.getElementById('send'),chat=document.getElementById('chat'),welcome=document.getElementById('welcome'),status=document.getElementById('status'),clearBtn=document.getElementById('clearBtn'),voiceBtn=document.getElementById('voiceBtn');let messages=[];try{messages=JSON.parse(localStorage.getItem('lucichat_messages')||'[]')}catch(e){messages=[]}
function save(){localStorage.setItem('lucichat_messages',JSON.stringify(messages))}function render(){chat.innerHTML='';welcome.style.display=messages.length?'none':'block';for(const m of messages){const box=document.createElement('div');box.className='msg '+(m.role==='user'?'user':'ai');const who=document.createElement('div');who.className='who';who.textContent=m.role==='user'?'You':'LuciChat';const text=document.createElement('div');text.textContent=m.content;box.append(who,text);chat.appendChild(box)}window.scrollTo(0,document.body.scrollHeight)}function add(role,content){messages.push({role,content});save();render()}function buildPrompt(userText){const recent=messages.slice(-8).map(m=>(m.role==='user'?'User: ':'LuciChat: ')+m.content).join('\n');return 'You are LuciChat, a friendly helpful AI assistant. Be clear, natural, concise, and safe. Continue the conversation using the recent messages below.\n\n'+recent+'\nUser: '+userText+'\nLuciChat:'}
async function sendMessage(){const text=input.value.trim();if(!text||send.disabled)return;input.value='';input.style.height='auto';add('user',text);send.disabled=true;status.textContent='Thinking...';const temp={role:'assistant',content:''};messages.push(temp);render();try{const url=ENDPOINT+encodeURIComponent(buildPrompt(text))+'?model='+encodeURIComponent(MODEL);const res=await fetch(url,{headers:{Accept:'text/plain'}});if(!res.ok)throw new Error('AI service returned '+res.status);const answer=(await res.text()).trim();temp.content=answer||'I did not get a response. Try again.';save();render();status.textContent=''}catch(err){messages.pop();save();render();status.textContent='Could not reach the AI service. Try again in a moment.';console.error(err)}finally{send.disabled=false;input.focus()}}
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});send.addEventListener('click',sendMessage);clearBtn.addEventListener('click',()=>{if(!messages.length)return;messages=[];save();render();status.textContent='Chat cleared.';setTimeout(()=>status.textContent='',1500);input.focus()});
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=null;if(SpeechRecognition){recognition=new SpeechRecognition();recognition.lang='en-US';recognition.interimResults=false;recognition.continuous=false;recognition.onstart=()=>{voiceBtn.classList.add('active');status.textContent='Listening...'};recognition.onresult=e=>{input.value=e.results[0][0].transcript;input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px';status.textContent='Voice captured ✓';input.focus();setTimeout(()=>status.textContent='',1200)};recognition.onerror=e=>{status.textContent=e.error==='not-allowed'?'Microphone permission was blocked.':'Voice input failed. Try again.'};recognition.onend=()=>voiceBtn.classList.remove('active');voiceBtn.addEventListener('click',()=>{try{recognition.start()}catch(e){recognition.stop()}})}else{voiceBtn.disabled=true;voiceBtn.title='Voice input is not supported in this browser'}
render();input.focus();
</script>
</body>
</html>
