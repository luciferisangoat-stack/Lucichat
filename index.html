<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuciChat — Local AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#070d1d;
  color:#eef2ff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  padding:16px;
  border-bottom:1px solid #26304a;
  background:#0c1328;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.title{
  font-size:24px;
  font-weight:800;
}

.subtitle{
  color:#9da9cf;
  font-size:13px;
  margin-top:3px;
}

button{
  border:0;
  border-radius:18px;
  padding:13px 18px;
  background:#3454c5;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.creator{
  background:#1b2647;
  font-size:14px;
  padding:10px 14px;
}

.status{
  padding:10px 16px;
  border-bottom:1px solid #26304a;
  color:#9da9cf;
  font-size:13px;
}

#chat{
  min-height:calc(100vh - 190px);
  padding:25px 18px 130px;
  max-width:850px;
  margin:auto;
}

.welcome{
  text-align:center;
  color:#aeb9df;
  font-size:22px;
  margin:120px auto 30px;
}

.message{
  margin:14px 0;
  padding:15px 17px;
  border-radius:18px;
  max-width:85%;
  white-space:pre-wrap;
  line-height:1.5;
}

.user{
  margin-left:auto;
  background:#2947a8;
}

.assistant{
  margin-right:auto;
  background:#18223f;
  border:1px solid #2d3b63;
}

.error{
  margin:16px 0;
  padding:24px;
  border-radius:25px;
  background:#18223f;
  border:1px solid #35446f;
  color:#f1f4ff;
}

.error-title{
  font-size:22px;
  margin-bottom:20px;
}

.error-text{
  font-size:18px;
  line-height:1.6;
  word-break:break-word;
}

.debug{
  margin-top:18px;
  padding:14px;
  border-radius:14px;
  background:#0b1226;
  color:#aeb9df;
  font-family:monospace;
  font-size:12px;
  white-space:pre-wrap;
  word-break:break-word;
}

.retry{
  display:block;
  margin:25px auto 0;
  font-size:17px;
  padding:15px 25px;
}

.composer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:15px;
  background:#0c1328;
  border-top:1px solid #26304a;
}

.composer-inner{
  max-width:850px;
  margin:auto;
  display:flex;
  gap:12px;
}

input{
  flex:1;
  min-width:0;
  border:2px solid #34436e;
  border-radius:35px;
  background:#111a35;
  color:white;
  padding:18px 22px;
  font-size:18px;
  outline:none;
}

input:focus{
  border-color:#4968d5;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:20;
}

.modal-box{
  width:100%;
  max-width:380px;
  background:#111a35;
  border:1px solid #34436e;
  border-radius:25px;
  padding:25px;
}

.modal-box h2{
  margin-top:0;
}

.modal-box input{
  width:100%;
  margin:12px 0;
}

.modal-buttons{
  display:flex;
  gap:10px;
  justify-content:flex-end;
}

@media(max-width:600px){
  .title{font-size:21px}
  .subtitle{font-size:12px}
  .creator{font-size:12px;padding:9px 11px}
  #chat{padding-left:12px;padding-right:12px}
  .message{max-width:92%}
  .welcome{font-size:20px}
  .composer-inner{gap:8px}
  .composer button{padding:12px 18px}
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <div>
      <div class="title">🤖 LuciChat</div>
      <div class="subtitle">Your personal AI assistant</div>
    </div>

    <button class="creator" id="creatorBtn">Creator</button>
  </div>
</header>

<div class="status" id="status">
  Starting LuciChat...
</div>

<main id="chat">

  <div class="welcome" id="welcome">
    LuciChat is loading...
  </div>

</main>

<div class="composer">
  <div class="composer-inner">
    <input
      id="messageInput"
      type="text"
      placeholder="Message LuciChat..."
      autocomplete="off"
      disabled
    >

    <button id="sendBtn" disabled>
      Send
    </button>
  </div>
</div>

<div class="modal" id="creatorModal">
  <div class="modal-box">

    <h2>🔐 Creator Access</h2>

    <p>Enter the creator PIN.</p>

    <input
      id="pinInput"
      type="password"
      inputmode="numeric"
      placeholder="PIN"
    >

    <div class="modal-buttons">
      <button id="closeModal">Cancel</button>
      <button id="unlockBtn">Unlock</button>
    </div>

  </div>
</div>

<script type="module">

/* =========================================================
   LUCICHAT CONFIG
   ========================================================= */

const MODEL = "Llama-3.2-1B-Instruct-q4f32_1-MLC";

const CREATOR_PIN = "1234";

let engine = null;
let starting = false;
let startupFinished = false;

const messages = [
  {
    role:"system",
    content:
      "You are LuciChat, a friendly personal AI assistant. Be helpful, concise, honest, and safe."
  }
];


/* =========================================================
   ELEMENTS
   ========================================================= */

const statusEl = document.getElementById("status");
const chatEl = document.getElementById("chat");
const welcomeEl = document.getElementById("welcome");
const inputEl = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

const creatorBtn = document.getElementById("creatorBtn");
const creatorModal = document.getElementById("creatorModal");
const closeModal = document.getElementById("closeModal");
const unlockBtn = document.getElementById("unlockBtn");
const pinInput = document.getElementById("pinInput");


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(text){
  statusEl.textContent = text;
}


/* =========================================================
   CHAT MESSAGES
   ========================================================= */

function addMessage(role,text){

  const div = document.createElement("div");

  div.className =
    "message " +
    (role === "user" ? "user" : "assistant");

  div.textContent = text;

  chatEl.appendChild(div);

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

  return div;
}


/* =========================================================
   ERROR DISPLAY
   ========================================================= */

function showStartupError(error, extra=""){

  /* Prevent duplicate error boxes */

  const old = document.getElementById("startupError");

  if(old){
    old.remove();
  }

  const box = document.createElement("div");

  box.id = "startupError";
  box.className = "error";

  let message = "Unknown error";

  if(error){

    if(typeof error === "string"){
      message = error;
    }
    else if(error.message){
      message = error.message;
    }
    else{
      try{
        message = JSON.stringify(error);
      }catch{
        message = String(error);
      }
    }

  }

  box.innerHTML = `
    <div class="error-title">
      ⚠️ AI startup error
    </div>

    <div class="error-text"></div>

    <div class="debug"></div>

    <button class="retry" id="retryBtn">
      🔄 Try Again
    </button>
  `;

  box.querySelector(".error-text").textContent =
    message;

  box.querySelector(".debug").textContent =
`Model:
${MODEL}

Secure context:
${window.isSecureContext}

WebGPU:
${!!navigator.gpu}

Browser:
${navigator.userAgent}

Extra:
${extra || "None"}`;

  chatEl.appendChild(box);

  document.getElementById("retryBtn").onclick = () => {

    const oldError =
      document.getElementById("startupError");

    if(oldError){
      oldError.remove();
    }

    startupFinished = false;

    startAI();
  };
}


/* =========================================================
   WEBGPU CHECK
   ========================================================= */

async function checkWebGPU(){

  if(!window.isSecureContext){

    throw new Error(
      "This page is not running in a secure HTTPS context."
    );

  }

  if(!navigator.gpu){

    throw new Error(
      "WebGPU is not available in this browser."
    );

  }

  let adapter;

  try{

    adapter =
      await navigator.gpu.requestAdapter();

  }catch(error){

    throw new Error(
      "The browser found WebGPU but could not access the GPU adapter: " +
      (error.message || error)
    );

  }

  if(!adapter){

    throw new Error(
      "WebGPU is available, but no GPU adapter was found."
    );

  }

  return adapter;
}


/* =========================================================
   START AI
   ========================================================= */

async function startAI(){

  if(starting){
    return;
  }

  if(engine){
    return;
  }

  starting = true;

  sendBtn.disabled = true;
  inputEl.disabled = true;

  setStatus("Checking WebGPU...");

  try{

    /* -------------------------
       CHECK WEBGPU
       ------------------------- */

    const adapter =
      await checkWebGPU();

    console.log(
      "WebGPU adapter:",
      adapter
    );

    setStatus("WebGPU found. Loading AI engine...");


    /* -------------------------
       LOAD WEBLLM
       ------------------------- */

    let WebLLM;

    try{

      WebLLM =
        await import(
          "https://esm.run/@mlc-ai/web-llm"
        );

    }catch(error){

      throw new Error(
        "Could not download the WebLLM library: " +
        (error.message || error)
      );

    }


    if(!WebLLM || !WebLLM.CreateMLCEngine){

      throw new Error(
        "WebLLM loaded, but CreateMLCEngine was not found."
      );

    }


    /* -------------------------
       START MODEL
       ------------------------- */

    setStatus(
      "Downloading AI model. This may take a while..."
    );

    engine =
      await WebLLM.CreateMLCEngine(
        MODEL,
        {

          initProgressCallback:(progress)=>{

            console.log(
              "AI progress:",
              progress
            );

            if(progress){

              if(progress.text){

                setStatus(
                  "AI: " + progress.text
                );

              }
              else if(
                typeof progress.progress === "number"
              ){

                const percent =
                  Math.round(
                    progress.progress * 100
                  );

                setStatus(
                  `Downloading AI model... ${percent}%`
                );

              }

            }

          },

          logLevel:"ERROR"

        }
      );


    /* -------------------------
       SUCCESS
       ------------------------- */

    startupFinished = true;

    setStatus(
      "🟢 LuciChat is ready!"
    );

    welcomeEl.textContent =
      "LuciChat is ready. Ask me anything!";

    inputEl.disabled = false;
    sendBtn.disabled = false;

    inputEl.focus();

  }catch(error){

    console.error(
      "LuciChat startup error:",
      error
    );

    engine = null;

    setStatus(
      "🔴 AI could not start"
    );

    welcomeEl.textContent =
      "LuciChat loaded, but the AI could not start.";

    showStartupError(
      error,
      "The diagnostic information above tells us where the failure happened."
    );

  }finally{

    starting = false;

  }

}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage(){

  const text =
    inputEl.value.trim();

  if(!text){
    return;
  }

  if(!engine){

    showStartupError(
      "The AI engine is not running yet."
    );

    return;
  }

  inputEl.value = "";

  addMessage(
    "user",
    text
  );

  messages.push({
    role:"user",
    content:text
  });

  sendBtn.disabled = true;
  inputEl.disabled = true;

  const thinking =
    addMessage(
      "assistant",
      "Thinking..."
    );

  try{

    const response =
      await engine.chat.completions.create({

        messages:messages,

        temperature:0.7,

        max_tokens:300

      });

    const reply =
      response?.choices?.[0]?.message?.content ||
      "I couldn't generate a response.";

    thinking.textContent =
      reply;

    messages.push({
      role:"assistant",
      content:reply
    });

  }catch(error){

    console.error(
      "Chat error:",
      error
    );

    thinking.textContent =
      "⚠️ Chat error: " +
      (error.message || error);

  }finally{

    sendBtn.disabled = false;
    inputEl.disabled = false;

    inputEl.focus();

  }

}


/* =========================================================
   SEND BUTTON
   ========================================================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* =========================================================
   ENTER KEY
   ========================================================= */

inputEl.addEventListener(
  "keydown",
  (event)=>{

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   CREATOR MODAL
   ========================================================= */

creatorBtn.addEventListener(
  "click",
  ()=>{

    creatorModal.style.display =
      "flex";

    pinInput.value = "";

    pinInput.focus();

  }
);


closeModal.addEventListener(
  "click",
  ()=>{

    creatorModal.style.display =
      "none";

  }
);


unlockBtn.addEventListener(
  "click",
  ()=>{

    if(pinInput.value === CREATOR_PIN){

      localStorage.setItem(
        "luciCreator",
        "true"
      );

      creatorBtn.textContent =
        "Creator ✓";

      creatorModal.style.display =
        "none";

    }
    else{

      alert("Incorrect PIN.");

    }

  }
);


pinInput.addEventListener(
  "keydown",
  (event)=>{

    if(event.key === "Enter"){

      unlockBtn.click();

    }

  }
);


/* =========================================================
   CREATOR STATUS
   ========================================================= */

if(
  localStorage.getItem("luciCreator") === "true"
){

  creatorBtn.textContent =
    "Creator ✓";

}


/* =========================================================
   START ONLY ONCE
   ========================================================= */

startAI();

</script>

</body>
</html>
