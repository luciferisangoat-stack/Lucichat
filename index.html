<script type="module">
import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

const MODEL = "Llama-3.2-1B-Instruct-q4f16_1-MLC";

let engine = null;

let messages = [
  {
    role: "system",
    content:
      "You are LuciChat, a friendly personal AI assistant. Be helpful, concise, and honest."
  }
];

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const statusbar = document.getElementById("statusbar");

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
  return d;
}

function setStatus(text, cls = "") {
  statusbar.className = cls;
  statusbar.textContent = text;
}

async function startAI() {
  if (!window.isSecureContext) {
    setStatus("LuciChat must be opened over HTTPS.", "bad");
    return;
  }

  if (!("gpu" in navigator)) {
    setStatus(
      "This browser does not provide WebGPU. Local AI cannot run here.",
      "bad"
    );
    add(
      "Your phone can open LuciChat, but this browser doesn't provide the graphics feature needed to run the local AI.",
      "bot"
    );
    return;
  }

  try {
    sendBtn.disabled = true;

    setStatus("Starting LuciChat AI…");

    engine = await CreateMLCEngine(MODEL, {
      initProgressCallback: (p) => {
        if (p && p.text) {
          setStatus("AI setup: " + p.text);
        }
      },
      logLevel: "ERROR"
    });

    setStatus("LuciChat AI is ready ✓", "good");

    document.getElementById("welcome").textContent =
      "I'm ready. 🤖💙 Ask me anything!";

    sendBtn.disabled = false;

  } catch (e) {
    console.error("WebLLM error:", e);

    sendBtn.disabled = false;

    const error = String(e?.message || e);

    setStatus("Local AI failed to start.", "bad");

    add(
      "I couldn't start the local AI on this device. The website itself is working, but the browser couldn't load the AI model.",
      "bot"
    );

    console.error(error);
  }
}

async function send() {
  const text = input.value.trim();

  if (!text) return;

  add(text, "user");
  input.value = "";

  if (!engine) {
    add(
      "The AI hasn't finished starting yet. Please wait until it says 'LuciChat AI is ready'.",
      "bot"
    );
    return;
  }

  sendBtn.disabled = true;

  messages.push({
    role: "user",
    content: text
  });

  const bubble = add("Thinking…", "bot");

  try {
    const res = await engine.chat.completions.create({
      messages,
      temperature: 0.7,
      max_tokens: 300
    });

    const answer =
      res.choices?.[0]?.message?.content ||
      "I couldn't generate a response.";

    bubble.textContent = answer;

    messages.push({
      role: "assistant",
      content: answer
    });

  } catch (e) {
    console.error(e);
    bubble.textContent =
      "Sorry — the local AI had an error. Please try again.";
  }

  sendBtn.disabled = false;
}

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    send();
  }
});

window.send = send;

window.openCreator = () => {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("pin").focus();
};

window.closeCreator = () => {
  document.getElementById("modal").style.display = "none";
  document.getElementById("result").textContent = "";
};

window.authorize = () => {
  const r = document.getElementById("result");

  if (document.getElementById("pin").value === "1234") {
    localStorage.setItem("luciCreator", "yes");
    document.getElementById("creatorStatus").textContent =
      "Creator: You ✓";

    r.className = "good";
    r.textContent = "Authorized! 👑";

    setTimeout(window.closeCreator, 700);
  } else {
    r.className = "bad";
    r.textContent = "Wrong PIN.";
  }
};

if (localStorage.getItem("luciCreator") === "yes") {
  document.getElementById("creatorStatus").textContent =
    "Creator: You ✓";
}

startAI();
 </script>
