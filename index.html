<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>LuciChat</title>
<style>
*{box-sizing:border-box}
:root{--bg:#080d19;--panel:#10182b;--panel2:#151f36;--line:#273451;--text:#f4f7ff;--muted:#9aa8c7;--accent:#6d72ff}
body{margin:0;background:radial-gradient(circle at top,#172344 0,#080d19 42%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.app{width:min(100%,980px);margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:18px 16px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:rgba(8,13,25,.92);backdrop-filter:blur(12px);z-index:5}
.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#7378ff,#3f49c9);font-size:22px}.title{font-size:21px;font-weight:800}.tag{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px}.small{width:auto;padding:9px 12px;font-size:13px;background:var(--panel2);border:1px solid var(--line)}
main{flex:1;padding:18px 14px 150px}.welcome{text-align:center;margin:45px auto 25px;max-width:620px}.welcome h1{font-size:32px;margin:0 0 9px}.welcome p{color:var(--muted);margin:0;line-height:1.6}
#chat{display:flex;flex-direction:column;gap:12px}.msg{max-width:82%;padding:13px 15px;border:1px solid var(--line);border-radius:17px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:#2a3762;border-bottom-right-radius:5px}.msg.ai{align-self:flex-start;background:var(--panel);border-bottom-left-radius:5px}.who{font-size:11px;color:#aeb9d5;margin-bottom:5px;font-weight:700}
.composer{position:fixed;bottom:0;left:0;right:0;padding:12px 14px max(12px,env(safe-area-inset-bottom));background:rgba(8,13,25,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line)}.compose-inner{width:min(100%,950px);margin:auto;display:flex;gap:9px;align-items:flex-end}textarea{flex:1;min-height:48px;max-height:150px;resize:none;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);padding:13px 14px;font:inherit;outline:none}textarea:focus{border-color:var(--accent)}button{border:0;border-radius:14px;padding:13px 17px;background:var(--accent);color:white;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.5;cursor:default}
.status{text-align:center;color:var(--muted);font-size:12px;margin-top:8px;min-height:18px}.notice{margin:20px auto;max-width:650px;color:var(--muted);font-size:12px;line-height:1.5;text-align:center}
@media(max-width:600px){header{padding:13px 12px}.logo{width:38px;height:38px}.title{font-size:19px}.small{padding:8px 10px}main{padding:10px 10px 145px}.welcome{margin:35px auto 20px}.welcome h1{font-size:27px}.msg{max-width:90%}.composer{padding-left:9px;padding-right:9px}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand"><div class="logo">🤖</div><div><div class="title">LuciChat</div><div class="tag">Your AI assistant • phone + computer</div></div></div>
<div class="actions"><button class="small" id="clearBtn">Clear</button></div>
</header>
<main>
<section class="welcome" id="welcome"><h1>Hey 👋 I'm LuciChat</h1><p>Ask me a question, get help with homework, brainstorm ideas, or just chat.</p></section>
<div id="chat"></div>
<div class="notice">AI responses use a public AI service. Don't put passwords, addresses, or other private information in your messages.</div>
</main>
<div class="composer"><div class="compose-inner"><textarea id="input" rows="1" placeholder="Message LuciChat..." aria-label="Message LuciChat"></textarea><button id="send">Send</button></div><div class="status" id="status"></div></div>
</div>
<script>
const ENDPOINT='https://text.pollinations.ai/';
const MODEL='openai-fast';
const input=document.getElementById('input');
const send=document.getElementById('send');
const chat=document.getElementById('chat');
const welcome=document.getElementById('welcome');
const status=document.getElementById('status');
const clearBtn=document.getElementById('clearBtn');
let messages=[];
try{messages=JSON.parse(localStorage.getItem('lucichat_messages')||'[]')}catch(e){messages=[]}
function save(){localStorage.setItem('lucichat_messages',JSON.stringify(messages))}
function render(){chat.innerHTML='';welcome.style.display=messages.length?'none':'block';for(const m of messages){const box=document.createElement('div');box.className='msg '+(m.role==='user'?'user':'ai');const who=document.createElement('div');who.className='who';who.textContent=m.role==='user'?'You':'LuciChat';const text=document.createElement('div');text.textContent=m.content;box.append(who,text);chat.appendChild(box)}window.scrollTo(0,document.body.scrollHeight)}
function add(role,content){messages.push({role,content});save();render()}
function buildPrompt(userText){const recent=messages.slice(-8).map(m=>(m.role==='user'?'User: ':'LuciChat: ')+m.content).join('\n');return 'You are LuciChat, a friendly helpful AI assistant. Be clear, natural, concise, and safe. Continue the conversation using the recent messages below.\n\n'+recent+'\nUser: '+userText+'\nLuciChat:'}
async function sendMessage(){const text=input.value.trim();if(!text||send.disabled)return;input.value='';input.style.height='auto';add('user',text);send.disabled=true;status.textContent='Thinking...';const temp={role:'assistant',content:''};messages.push(temp);render();try{const url=ENDPOINT+encodeURIComponent(buildPrompt(text))+'?model='+encodeURIComponent(MODEL);const res=await fetch(url,{headers:{Accept:'text/plain'}});if(!res.ok)throw new Error('AI service returned '+res.status);const answer=(await res.text()).trim();temp.content=answer||'I did not get a response. Try again.';save();render();status.textContent='';}catch(err){messages.pop();save();render();status.textContent='Could not reach the AI service. Try again in a moment.';console.error(err)}finally{send.disabled=false;input.focus()}}
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
send.addEventListener('click',sendMessage);
clearBtn.addEventListener('click',()=>{if(!messages.length)return;messages=[];save();render();status.textContent='Chat cleared.';setTimeout(()=>status.textContent='',1500);input.focus()});
render();input.focus();
</script>
</body>
</html>
