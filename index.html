<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>LuciChat — Local AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b1020;
  color:#eef2ff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  padding:20px;
  border-bottom:1px solid #26304a;
  background:#0e1529;
}

h1{
  margin:0;
  font-size:28px;
}

.subtitle{
  margin-top:6px;
  color:#9ca8c7;
}

main{
  max-width:800px;
  margin:auto;
  padding:16px;
}

.card{
  background:#111a30;
  border:1px solid #26304a;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
}

.status{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:18px;
  margin-bottom:14px;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#777;
  flex:none;
}

.dot.loading{background:#f4c542}
.dot.ready{background:#35d07f}
.dot.error{background:#ff5c69}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  background:#5865f2;
  color:white;
  font-size:17px;
  font-weight:700;
}

button:disabled{
  opacity:.45;
}

#progress{
  margin-top:12px;
  color:#aab5d3;
  font-size:14px;
  line-height:1.5;
  word-break:break-word;
}

#chat{
  min-height:180px;
  max-height:55vh;
  overflow-y:auto;
}

.message{
  margin:10px 0;
  padding:13px;
  border-radius:14px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user{
  background:#26345d;
  margin-left:10%;
}

.assistant{
  background:#18233d;
  margin-right:10%;
}

.label{
  color:#8995b5;
  font-size:12px;
  margin-bottom:5px;
}

textarea{
  width:100%;
  min-height:95px;
  margin-top:12px;
  padding:13px;
  resize:vertical;
  border-radius:13px;
  border:1px solid #303d5d;
  background:#0b1224;
  color:#eef2ff;
  font:inherit;
  outline:none;
}

textarea:focus{
  border-color:#5865f2;
}

#sendButton{
  margin-top:10px;
}

.error{
  color:#ff7b86;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.info{
  color:#9ca8c7;
  font-size:14px;
  line-height:1.7;
}
</style>
</head>

<body>

<header>
  <h1>🤖 LuciChat</h1>
  <div class="subtitle">
    Private local AI running in your browser
  </div>
</header>

<main>

<div class="card">

  <div class="status">
    <div id="statusDot" class="dot"></div>
    <strong id="statusText">AI is not loaded</strong>
  </div>

  <button id="loadButton">
    🚀 Load AI
  </button>

  <div id="progress">
    Ready.
  </div>

</div>


<div class="card">

  <div id="chat">

    <div class="message assistant">
      <div class="label">LuciChat</div>
      Load the AI above to start chatting.
    </div>

  </div>

  <textarea
    id="prompt"
    disabled
    placeholder="Type your message..."
  ></textarea>

  <button
    id="sendButton"
    disabled
  >
    Send
  </button>

</div>


<div class="card">

  <div class="info">

    <strong>System</strong><br>

    Model:
    SmolLM2-360M-Instruct-q4f32_1-MLC
    <br>

    WebGPU:
    <span id="gpuInfo">Checking...</span>

    <br>

    WebLLM:
    <span id="webllmInfo">Not loaded</span>

    <br>

    Model files:
    Cloudflare proxy

  </div>

</div>

</main>


<script type="module">

const MODEL =
  "SmolLM2-360M-Instruct-q4f32_1-MLC";

/*
  IMPORTANT:

  This is your Cloudflare Worker URL.

  Because the website itself is running on
  goat.workers.dev, we can use the same origin.
*/
const WORKER =
  window.location.origin;


/*
  WebLLM JavaScript itself.

  This is ONLY the JavaScript library.

  The actual model files are downloaded
  through our Cloudflare Worker below.
*/
const WEBLLM_URL =
  "https://esm.run/@mlc-ai/web-llm@0.2.85";


let webllm = null;
let engine = null;
let loading = false;
let generating = false;


const loadButton =
  document.getElementById("loadButton");

const sendButton =
  document.getElementById("sendButton");

const promptBox =
  document.getElementById("prompt");

const chat =
  document.getElementById("chat");

const progress =
  document.getElementById("progress");

const statusText =
  document.getElementById("statusText");

const statusDot =
  document.getElementById("statusDot");

const gpuInfo =
  document.getElementById("gpuInfo");

const webllmInfo =
  document.getElementById("webllmInfo");


function setStatus(text,type=""){

  statusText.textContent = text;

  statusDot.className = "dot";

  if(type){
    statusDot.classList.add(type);
  }
}


function addMessage(role,text){

  const box =
    document.createElement("div");

  box.className =
    "message " +
    (role === "user"
      ? "user"
      : "assistant");

  const label =
    document.createElement("div");

  label.className = "label";

  label.textContent =
    role === "user"
      ? "You"
      : "LuciChat";

  const content =
    document.createElement("div");

  content.textContent = text;

  box.appendChild(label);
  box.appendChild(content);

  chat.appendChild(box);

  chat.scrollTop =
    chat.scrollHeight;

  return content;
}


/*
  Check WebGPU.
*/
async function checkGPU(){

  if(!navigator.gpu){

    gpuInfo.textContent =
      "Not available";

    throw new Error(
      "WebGPU is not available."
    );
  }

  const adapter =
    await navigator.gpu.requestAdapter();

  if(!adapter){

    gpuInfo.textContent =
      "No adapter";

    throw new Error(
      "No compatible WebGPU adapter was found."
    );
  }

  gpuInfo.textContent =
    "Available ✓";
}


/*
  Build the custom WebLLM configuration.

  Instead of letting WebLLM contact Hugging Face
  directly, the model URL goes through our Worker.
*/
function createAppConfig(){

  const modelURL =
    WORKER +
    "/hf/mlc-ai/" +
    MODEL;

  const modelLibURL =
    WORKER +
    "/lib/v0_2_84/base/" +
    MODEL +
    "_cs1k-webgpu.wasm";


  return {

    model_list: [

      {

        model: modelURL,

        model_id: MODEL,

        model_lib:
          modelLibURL,

        vram_required_MB:
          579.61,

        low_resource_required:
          true,

        overrides: {

          context_window_size:
            4096

        }

      }

    ]

  };
}


/*
  Load WebLLM + model.
*/
async function loadAI(){

  if(loading || engine){
    return;
  }

  loading = true;

  loadButton.disabled = true;

  setStatus(
    "Loading AI...",
    "loading"
  );

  progress.textContent =
    "Checking WebGPU...";


  try{

    await checkGPU();


    /*
      Load WebLLM JavaScript.
    */
    progress.textContent =
      "Loading WebLLM...";

    webllm =
      await import(WEBLLM_URL);

    webllmInfo.textContent =
      "Loaded ✓";


    /*
      Custom configuration.
    */
    const appConfig =
      createAppConfig();


    /*
      Show progress.
    */
    const initProgressCallback =
      (report) => {

        if(!report){
          return;
        }

        let text =
          report.text || "";

        if(
          report.progress !== undefined
        ){

          const percent =
            Math.round(
              report.progress * 100
            );

          text +=
            " " +
            percent +
            "%";
        }

        progress.textContent =
          text ||
          "Loading model...";
      };


    progress.textContent =
      "Starting local AI...";


    /*
      Create the engine.
    */
    engine =
      await webllm.CreateMLCEngine(

        MODEL,

        {

          appConfig:
            appConfig,

          initProgressCallback:
            initProgressCallback,

          logLevel:
            "INFO"

        }

      );


    /*
      Success!
    */
    setStatus(
      "AI is ready ✓",
      "ready"
    );

    progress.textContent =
      "Model loaded successfully.";

    promptBox.disabled = false;
    sendButton.disabled = false;

    loadButton.textContent =
      "✓ AI Loaded";

    promptBox.focus();


  }catch(error){

    console.error(error);

    engine = null;

    setStatus(
      "AI failed to load",
      "error"
    );

    progress.innerHTML = "";

    const errorBox =
      document.createElement("div");

    errorBox.className =
      "error";

    errorBox.textContent =
      "ERROR:\n\n" +
      (
        error?.stack ||
        error?.message ||
        String(error)
      );

    progress.appendChild(errorBox);

    loadButton.disabled =
      false;

    loadButton.textContent =
      "🔄 Try Again";

  }finally{

    loading = false;

  }
}


/*
  Send chat message.
*/
async function sendMessage(){

  if(
    !engine ||
    generating
  ){
    return;
  }

  const text =
    promptBox.value.trim();

  if(!text){
    return;
  }

  generating = true;

  sendButton.disabled = true;
  promptBox.disabled = true;

  promptBox.value = "";


  addMessage(
    "user",
    text
  );


  const answer =
    addMessage(
      "assistant",
      ""
    );


  try{

    const stream =
      await engine.chat.completions.create({

        messages:[

          {

            role:"system",

            content:
              "You are LuciChat, a helpful " +
              "friendly AI assistant. " +
              "Answer clearly and naturally."

          },

          {

            role:"user",

            content:text

          }

        ],

        temperature:0.7,

        max_tokens:512,

        stream:true

      });


    for await(
      const chunk of stream
    ){

      const delta =
        chunk?.choices?.[0]?.delta?.content;

      if(delta){

        answer.textContent +=
          delta;

        chat.scrollTop =
          chat.scrollHeight;

      }

    }


  }catch(error){

    console.error(error);

    answer.textContent =
      "Generation error:\n\n" +
      (
        error?.message ||
        String(error)
      );

  }finally{

    generating = false;

    sendButton.disabled =
      false;

    promptBox.disabled =
      false;

    promptBox.focus();

  }

}


loadButton.addEventListener(
  "click",
  loadAI
);


sendButton.addEventListener(
  "click",
  sendMessage
);


promptBox.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/*
  Initial GPU check.
*/
(async()=>{

  try{

    await checkGPU();

  }catch(error){

    setStatus(
      "WebGPU unavailable",
      "error"
    );

    progress.textContent =
      error.message;

  }

})();

</script>

</body>
</html>
