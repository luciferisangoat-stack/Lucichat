<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuciChat — Local AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#070c1c;
  color:#eef2ff;
  font-family:system-ui,-apple-system,sans-serif;
}

header{
  padding:16px;
  border-bottom:1px solid #293452;
  background:#11182f;
  position:relative;
}

.title{
  font-size:32px;
  font-weight:800;
}

.subtitle{
  color:#aab5d5;
  font-size:18px;
  margin-top:2px;
}

#creatorBtn{
  position:absolute;
  right:16px;
  top:20px;
  border:0;
  background:none;
  color:#aab5d5;
  font-size:18px;
  font-weight:700;
  padding:8px;
}

#creatorStatus{
  position:absolute;
  right:16px;
  top:54px;
  font-size:13px;
  color:#7ee2a8;
}

#statusbar{
  padding:11px 16px;
  background:#0c1328;
  color:#aab5d5;
  border-bottom:1px solid #293452;
  font-size:14px;
  min-height:40px;
}

#statusbar.good{
  color:#7ee2a8;
}

#statusbar.bad{
  color:#ff8d8d;
}

#chat{
  min-height:calc(100vh - 210px);
  padding:30px 18px 125px;
}

#welcome{
  text-align:center;
  color:#aab5d5;
  font-size:25px;
  margin-top:55px;
}

.msg{
  max-width:85%;
  padding:14px 18px;
  margin:12px 0;
  border-radius:20px;
  font-size:17px;
  line-height:1.45;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user{
  margin-left:auto;
  background:#29469d;
}

.bot{
  margin-right:auto;
  background:#17213e;
  border:1px solid #293452;
}

#composer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:14px 16px;
  background:#0c1328;
  border-top:1px solid #293452;
  display:flex;
  gap:12px;
  z-index:5;
}

#input{
  flex:1;
  min-width:0;
  background:#151e3a;
  color:#eef2ff;
  border:2px solid #344269;
  border-radius:28px;
  padding:17px 24px;
  font-size:18px;
  outline:none;
}

#input:focus{
  border-color:#5169bd;
}

#sendBtn{
  border:0;
  border-radius:28px;
  padding:0 27px;
  background:#304aa2;
  color:white;
  font-size:18px;
  font-weight:700;
  min-width:110px;
}

#sendBtn:disabled{
  opacity:.5;
}

#modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  align-items:center;
  justify-content:center;
  z-index:20;
}

.modalbox{
  width:min(90%,360px);
  background:#151e3a;
  border:1px solid #344269;
  border-radius:20px;
  padding:24px;
}

.modalbox h2{
  margin-top:0;
}

#pin{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #344269;
  background:#0c1328;
  color:white;
  font-size:18px;
  outline:none;
}

.modalbuttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.modalbuttons button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:12px;
  font-weight:700;
}

#authorizeBtn{
  background:#304aa2;
  color:white;
}

#closeBtn{
  background:#293452;
  color:white;
}

#result{
  margin-top:12px;
  color:#aab5d5;
}

.retry{
  display:block;
  margin:18px auto;
  padding:12px 20px;
  border:0;
  border-radius:14px;
  background:#304aa2;
  color:white;
  font-size:16px;
  font-weight:700;
}

@media(max-width:500px){

  .title{
    font-size:30px;
  }

  .subtitle{
    font-size:17px;
  }

  #chat{
    padding-top:20px;
  }

  #welcome{
    font-size:22px;
  }

  #sendBtn{
    padding:0 20px;
    min-width:95px;
  }

  #input{
    padding-left:20px;
    padding-right:20px;
  }
}
</style>
</head>

<body>

<header>

  <div class="title">
    🤖 LuciChat
  </div>

  <div class="subtitle">
    Your personal AI assistant
  </div>

  <div id="creatorStatus"></div>

  <button id="creatorBtn">
    Creator
  </button>

</header>

<div id="statusbar">
  Starting LuciChat...
</div>

<main id="chat">

  <div id="welcome">
    Loading LuciChat AI... 🤖💙
  </div>

</main>

<div id="composer">

  <input
    id="input"
    type="text"
    placeholder="Message LuciChat..."
    autocomplete="off"
    spellcheck="true"
  >

  <button id="sendBtn" disabled>
    Send
  </button>

</div>

<div id="modal">

  <div class="modalbox">

    <h2>👑 Creator Access</h2>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      placeholder="Enter PIN"
    >

    <div class="modalbuttons">

      <button id="authorizeBtn">
        Unlock
      </button>

      <button id="closeBtn">
        Cancel
      </button>

    </div>

    <div id="result"></div>

  </div>

</div>


<script type="module">

/*
  =========================================================
  LUCICHAT AI
  =========================================================
*/

/*
  Smaller Llama 3.2 model.
  WebLLM currently lists this model.
*/
const MODEL =
  "Llama-3.2-1B-Instruct-q4f32_1-MLC";


let engine = null;

let starting = false;


/*
  Conversation history
*/
const messages = [

  {
    role:"system",

    content:
      "You are LuciChat, a friendly personal AI assistant. " +
      "Be helpful, concise, honest, and safe."
  }

];


/*
  Page elements
*/
const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const sendBtn =
  document.getElementById("sendBtn");

const statusbar =
  document.getElementById("statusbar");

const welcome =
  document.getElementById("welcome");


/*
  Status message
*/
function setStatus(text,type=""){

  statusbar.textContent = text;

  statusbar.className = type;

}


/*
  Add chat bubble
*/
function addMessage(text,type){

  const bubble =
    document.createElement("div");

  bubble.className =
    "msg " + type;

  bubble.textContent =
    text;

  chat.appendChild(bubble);

  window.scrollTo(
    0,
    document.body.scrollHeight
  );

  return bubble;

}


/*
  Remove welcome message
*/
function removeWelcome(){

  if(welcome){

    welcome.style.display =
      "none";

  }

}


/*
  =========================================================
  START AI
  =========================================================
*/

async function startAI(){

  if(starting){
    return;
  }

  if(engine){
    return;
  }

  starting = true;

  sendBtn.disabled = true;

  setStatus(
    "Checking browser..."
  );


  /*
    HTTPS check
  */

  if(!window.isSecureContext){

    setStatus(
      "HTTPS is required.",
      "bad"
    );

    welcome.textContent =
      "LuciChat needs to be opened using HTTPS.";

    starting = false;

    return;

  }


  /*
    WebGPU check
  */

  if(!navigator.gpu){

    setStatus(
      "WebGPU is not available.",
      "bad"
    );

    welcome.textContent =
      "This browser does not provide WebGPU, so the local AI cannot run here.";

    starting = false;

    return;

  }


  try{

    /*
      Download WebLLM itself
    */

    setStatus(
      "WebGPU found ✓ Loading WebLLM..."
    );


    const WebLLM =
      await import(
        "https://esm.run/@mlc-ai/web-llm"
      );


    setStatus(
      "WebLLM loaded ✓ Preparing AI..."
    );


    /*
      Load model
    */

    engine =
      await WebLLM.CreateMLCEngine(

        MODEL,

        {

          initProgressCallback:
            function(progress){

              console.log(
                "LuciChat loading:",
                progress
              );


              if(!progress){
                return;
              }


              /*
                WebLLM normally supplies
                progress.text.
              */

              if(progress.text){

                setStatus(
                  progress.text
                );

                return;

              }


              /*
                Backup percentage
              */

              if(
                typeof progress.progress ===
                "number"
              ){

                const percent =
                  Math.round(
                    progress.progress * 100
                  );


                setStatus(
                  "Loading AI model: " +
                  percent +
                  "%"
                );

              }

            },

          logLevel:"ERROR"

        }

      );


    /*
      SUCCESS
    */

    setStatus(
      "LuciChat AI is ready ✓",
      "good"
    );


    welcome.textContent =
      "I'm ready. 🤖💙 Ask me anything!";


    sendBtn.disabled = false;

    input.focus();

    starting = false;


  }catch(error){

    /*
      FAILURE
    */

    console.error(
      "LuciChat startup error:",
      error
    );


    engine = null;

    starting = false;

    sendBtn.disabled = true;


    let errorText =
      error &&
      error.message
        ? error.message
        : String(error);


    setStatus(
      "AI could not start.",
      "bad"
    );


    welcome.textContent =
      "LuciChat loaded, but the AI could not start.";


    addMessage(

      "⚠️ AI startup error:\n\n" +
      errorText +
      "\n\n" +
      "If this says 'Failed to fetch', the browser could not download one of the AI files.",

      "bot"

    );


    /*
      Retry button
    */

    const retry =
      document.createElement("button");

    retry.className =
      "retry";

    retry.textContent =
      "🔄 Try Again";


    retry.onclick =
      function(){

        retry.remove();

        startAI();

      };


    chat.appendChild(retry);

  }

}


/*
  =========================================================
  SEND MESSAGE
  =========================================================
*/

async function sendMessage(){

  const text =
    input.value.trim();


  if(!text){
    return;
  }


  removeWelcome();


  /*
    Show user message
  */

  addMessage(
    text,
    "user"
  );


  input.value = "";


  /*
    AI not ready
  */

  if(!engine){

    addMessage(

      "LuciChat is still starting. " +
      "Please wait until the status says " +
      "\"LuciChat AI is ready ✓\".",

      "bot"

    );

    return;

  }


  sendBtn.disabled = true;


  /*
    Save user message
  */

  messages.push({

    role:"user",

    content:text

  });


  /*
    Thinking bubble
  */

  const thinking =
    addMessage(
      "Thinking...",
      "bot"
    );


  try{

    const response =
      await engine.chat.completions.create({

        messages:messages,

        temperature:0.7,

        max_tokens:300

      });


    const answer =
      response &&
      response.choices &&
      response.choices[0] &&
      response.choices[0].message &&
      response.choices[0].message.content
        ? response.choices[0].message.content
        : "I couldn't generate a response.";


    thinking.textContent =
      answer;


    /*
      Save AI response
    */

    messages.push({

      role:"assistant",

      content:answer

    });


  }catch(error){

    console.error(
      "Chat error:",
      error
    );


    thinking.textContent =
      "⚠️ Sorry — LuciChat had an error generating that response.";

  }


  sendBtn.disabled = false;

  input.focus();

}


/*
  =========================================================
  SEND BUTTON
  =========================================================
*/

sendBtn.addEventListener(
  "click",
  sendMessage
);


/*
  =========================================================
  ENTER KEY
  =========================================================
*/

input.addEventListener(

  "keydown",

  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      sendMessage();

    }

  }

);


/*
  =========================================================
  CREATOR MODAL
  =========================================================
*/

const modal =
  document.getElementById("modal");

const pin =
  document.getElementById("pin");

const result =
  document.getElementById("result");


/*
  Open
*/

document
  .getElementById("creatorBtn")
  .addEventListener(

    "click",

    function(){

      modal.style.display =
        "flex";

      pin.value = "";

      result.textContent = "";

      pin.focus();

    }

  );


/*
  Close
*/

document
  .getElementById("closeBtn")
  .addEventListener(

    "click",

    function(){

      modal.style.display =
        "none";

    }

  );


/*
  =========================================================
  CREATOR ACCESS
  =========================================================
*/

document
  .getElementById("authorizeBtn")
  .addEventListener(

    "click",

    function(){

      /*
        This is only a simple client-side
        creator lock, NOT real security.
      */

      if(pin.value === "1234"){

        localStorage.setItem(
          "luciCreator",
          "yes"
        );


        document
          .getElementById("creatorStatus")
          .textContent =
          "Creator: You ✓";


        result.textContent =
          "Authorized! 👑";


        setTimeout(

          function(){

            modal.style.display =
              "none";

          },

          700

        );


      }else{

        result.textContent =
          "Wrong PIN.";

      }

    }

  );


/*
  Remember creator status
*/

if(
  localStorage.getItem(
    "luciCreator"
  ) === "yes"
){

  document
    .getElementById("creatorStatus")
    .textContent =
    "Creator: You ✓";

}


/*
  =========================================================
  START LUCICHAT
  =========================================================
*/

startAI();

</script>

</body>
</html>
