<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuciChat — Local AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b1020;
  color: #eef2ff;
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh;
}

header {
  padding: 16px;
  border-bottom: 1px solid #26304a;
  background: #11182d;
  position: sticky;
  top: 0;
  z-index: 5;
}

.title {
  font-size: 22px;
  font-weight: 700;
}

.subtitle {
  color: #9aa7c7;
  font-size: 13px;
  margin-top: 3px;
}

#statusbar {
  padding: 9px 16px;
  font-size: 13px;
  background: #151d35;
  color: #aeb9d6;
}

#statusbar.good {
  color: #72f5a0;
}

#statusbar.bad {
  color: #ff7b8a;
}

#chat {
  padding: 18px;
  padding-bottom: 110px;
  max-width: 800px;
  margin: auto;
}

.msg {
  padding: 12px 14px;
  margin: 10px 0;
  border-radius: 14px;
  max-width: 85%;
  white-space: pre-wrap;
  word-wrap: break-word;
}

.user {
  background: #315cff;
  margin-left: auto;
}

.bot {
  background: #18213b;
  border: 1px solid #293653;
  margin-right: auto;
}

#welcome {
  text-align: center;
  color: #aeb9d6;
  margin: 40px 0;
}

#composer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px;
  background: #0e1529;
  border-top: 1px solid #26304a;
  display: flex;
  gap: 8px;
  z-index: 10;
}

#input {
  flex: 1;
  min-width: 0;
  border: 1px solid #35415f;
  background: #151e36;
  color: white;
  border-radius: 12px;
  padding: 12px;
  font-size: 16px;
  outline: none;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 0 16px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

#sendBtn {
  background: #4169ff;
  color: white;
}

#sendBtn:disabled {
  opacity: .5;
}

#creatorBtn {
  position: fixed;
  right: 12px;
  top: 10px;
  background: transparent;
  color: #9aa7c7;
  padding: 6px;
  font-size: 12px;
}

#modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  align-items: center;
  justify-content: center;
  z-index: 50;
}

.modalbox {
  width: calc(100% - 40px);
  max-width: 350px;
  background: #151e36;
  border: 1px solid #35415f;
  border-radius: 18px;
  padding: 20px;
}

.modalbox h2 {
  margin-top: 0;
}

#pin {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #35415f;
  background: #0c1326;
  color: white;
  font-size: 16px;
  margin: 10px 0;
}

.modalbuttons {
  display: flex;
  gap: 8px;
}

.modalbuttons button {
  padding: 11px 14px;
}

#authorizeBtn {
  background: #4169ff;
  color: white;
}

#closeBtn {
  background: #293653;
  color: white;
}

#result {
  margin-top: 12px;
  font-size: 14px;
}

#creatorStatus {
  font-size: 12px;
  color: #72f5a0;
  margin-top: 5px;
}
</style>
</head>

<body>

<header>
  <div class="title">🤖 LuciChat</div>
  <div class="subtitle">Your personal AI assistant</div>
  <div id="creatorStatus"></div>

  <button id="creatorBtn">Creator</button>
</header>

<div id="statusbar">Starting LuciChat…</div>

<main id="chat">
  <div id="welcome">Loading LuciChat AI… 🤖💙</div>
</main>

<div id="composer">
  <input
    id="input"
    type="text"
    placeholder="Message LuciChat..."
    autocomplete="off"
  >
  <button id="sendBtn" disabled>Send</button>
</div>

<div id="modal">
  <div class="modalbox">
    <h2>👑 Creator Access</h2>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      placeholder="Enter PIN"
    >

    <div class="modalbuttons">
      <button id="authorizeBtn">Unlock</button>
      <button id="closeBtn">Cancel</button>
    </div>

    <div id="result"></div>
  </div>
</
