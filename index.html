<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>LuciChat — Satanist Luci</title>
<style>
*{box-sizing:border-box}
:root{--red:#ff1733;--deep:#080204;--panel:#0d070a;--line:#64101d;--soft:#d7bfd0;--muted:#9f8998}
html,body{margin:0;min-height:100%;background:#030303;color:#fff;font-family:Georgia,'Times New Roman',serif}
body{overflow-x:hidden;background:radial-gradient(circle at 65% 30%,rgba(95,0,12,.35),transparent 32%),radial-gradient(circle at 50% 0%,rgba(85,0,12,.3),transparent 38%),#030303}
.app{min-height:100vh;display:flex;flex-direction:column;position:relative}
header{height:100px;display:flex;align-items:center;justify-content:space-between;padding:12px 28px;border-bottom:1px solid var(--red);background:linear-gradient(180deg,#040404,#080204);position:sticky;top:0;z-index:20;box-shadow:0 5px 30px rgba(255,0,25,.08)}
.brand{display:flex;align-items:center;gap:14px}.logo{width:78px;height:78px;display:grid;place-items:center;color:var(--red);font-size:62px;line-height:1;border:0;text-shadow:0 0 18px rgba(255,20,45,.65);font-family:Georgia,serif}.brand-text .title{font-size:45px;font-weight:700;line-height:.9;letter-spacing:-1px;color:#f0172e}.brand-text .tag{margin-top:10px;font-size:15px;letter-spacing:2px;color:#dfbccf;text-transform:uppercase}
.top{display:flex;align-items:center;gap:24px}.persona{color:var(--red);font-family:system-ui,sans-serif;font-size:18px;border:0;border-bottom:1px solid var(--red);background:none;padding:10px 8px;cursor:pointer}.dots{background:none;color:var(--red);font-size:28px;padding:4px 8px}
.layout{display:flex;flex:1;min-height:calc(100vh - 100px)}
.sidebar{width:375px;flex:0 0 375px;border-right:1px solid var(--red);background:linear-gradient(180deg,#050304,#020202 70%);padding:20px 18px;position:relative;overflow:hidden}.nav{display:flex;flex-direction:column;gap:10px}.nav button{width:100%;display:flex;align-items:center;gap:25px;text-align:left;border:1px solid transparent;background:transparent;color:#d9bfd2;padding:18px 25px;border-radius:0 15px 15px 0;font-family:system-ui,sans-serif;font-size:21px;cursor:pointer}.nav button.active{color:var(--red);background:linear-gradient(90deg,#330009,#160205);border-color:var(--red);box-shadow:0 0 22px rgba(255,0,30,.12)}.nav button:hover{color:#fff;border-color:#6e1824}.ico{width:35px;text-align:center;font-size:31px;color:inherit}.sigil{width:180px;height:180px;border:3px solid #b40019;border-radius:50%;margin:55px auto 28px;display:grid;place-items:center;position:relative;box-shadow:0 0 25px rgba(255,0,25,.14)}.sigil:before{content:'⛧';font-size:125px;color:#cf001e;text-shadow:0 0 15px #ff1530}.side-quote{text-align:center;color:#ef1c32;font-size:20px;letter-spacing:2px;line-height:1.45;text-transform:uppercase}.cross{height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);margin:20px 30px}
.content{flex:1;min-width:0;position:relative;background:radial-gradient(circle at 52% 25%,rgba(100,0,15,.25),transparent 34%),radial-gradient(circle at 85% 65%,rgba(110,0,15,.2),transparent 28%);overflow:hidden}.content:before{content:'⛧';position:absolute;left:50%;top:28px;transform:translateX(-50%);font-size:390px;color:rgba(120,0,15,.11);line-height:1;pointer-events:none}.hero{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:110px 40px 210px;text-align:center}.hero h1{font-size:58px;color:var(--red);margin:230px 0 18px;line-height:1.05;font-weight:500}.hero .iam{font-size:25px;letter-spacing:9px;color:#e6cedd;margin-bottom:30px}.divider{width:440px;max-width:85%;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);margin:0 auto 35px;position:relative}.divider:after{content:'✦';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--red);background:#080204;padding:0 12px;font-size:22px}.hero p{font-size:21px;line-height:1.65;color:#d5bccb;max-width:760px;margin:0 auto}.hero p strong{color:#fff}
#chat{position:relative;z-index:2;display:flex;flex-direction:column;gap:14px;max-width:850px;margin:0 auto;padding:0 25px 250px}.msg{font-family:system-ui,sans-serif;max-width:80%;padding:14px 17px;border:1px solid #49121d;border-radius:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;background:#0b0809}.msg.user{align-self:flex-end;background:#2b070e;border-color:#821525}.msg.ai{align-self:flex-start;background:#0e0a0c}.who{font-size:11px;color:#c69bad;margin-bottom:5px;font-weight:700}.aiimg{display:block;width:min(100%,650px);border-radius:12px;border:1px solid #7b1726;margin-top:9px}
.composer-wrap{position:fixed;left:375px;right:0;bottom:0;z-index:15;padding:0 18px 28px;background:linear-gradient(180deg,transparent,rgba(3,1,2,.96) 28%)}.composer{max-width:1150px;margin:0 auto;border:1px solid var(--red);border-radius:60px;background:rgba(7,3,6,.94);box-shadow:0 0 25px rgba(255,0,25,.12);padding:14px 22px}.compose-inner{display:flex;align-items:center;gap:16px}.tool{width:58px;height:58px;flex:0 0 58px;border-radius:50%;border:0;background:transparent;color:#d8c0d1;font-size:34px;cursor:pointer}.tool:hover{color:var(--red);text-shadow:0 0 12px var(--red)}.imagebtn{font-size:34px}.voice{border:2px solid var(--red);color:var(--red);box-shadow:0 0 15px rgba(255,0,30,.32)}.voice:after{content:'⛧';font-size:40px}.voice{font-size:0}.voice.active{background:#33000a;box-shadow:0 0 25px rgba(255,0,30,.65)}textarea{flex:1;min-height:58px;max-height:150px;border:0;outline:0;background:transparent;color:#fff;font:21px system-ui,sans-serif;resize:none;padding:17px 8px}textarea::placeholder{color:#887482}.send{width:58px;height:58px;border:0;background:transparent;color:var(--red);font-size:43px;line-height:1;cursor:pointer}.send:after{content:'➤'}.send:hover{transform:translateX(2px);text-shadow:0 0 14px var(--red)}.status{text-align:center;min-height:18px;color:#b999aa;font:12px system-ui,sans-serif;margin-top:5px}
.menu{position:fixed;right:20px;top:78px;width:310px;background:#0b0709;border:1px solid var(--red);border-radius:14px;padding:15px;z-index:30;display:none;box-shadow:0 15px 45px rgba(0,0,0,.8),0 0 20px rgba(255,0,30,.12)}.menu.open{display:block}.menu button{display:block;width:100%;text-align:left;background:#14090c;border:1px solid #45111a;color:#e7cfdb;padding:13px;border-radius:10px;margin:7px 0;font:700 15px system-ui,sans-serif}.menu h2{color:var(--red);margin:4px 0 12px;font-size:20px}.menu .close{text-align:center}
.notice{display:none}
@media(max-width:900px){header{height:78px;padding:8px 12px}.logo{width:48px;height:48px;font-size:40px}.brand-text .title{font-size:28px}.brand-text .tag{display:none}.top{gap:5px}.persona{font-size:14px}.sidebar{width:260px;flex-basis:260px}.composer-wrap{left:260px}.nav button{font-size:16px;padding:15px}.hero h1{font-size:44px}.hero{padding-top:50px}.hero h1{margin-top:150px}}
@media(max-width:650px){.layout{display:block}.sidebar{position:fixed;left:-310px;top:78px;bottom:0;width:290px;z-index:25;transition:left .2s ease;box-shadow:15px 0 35px rgba(0,0,0,.7)}.sidebar.open{left:0}.content{min-height:calc(100vh - 78px)}header{position:sticky}.brand-text .title{font-size:25px}.persona{font-size:12px}.dots{font-size:23px}.hero{padding:35px 18px 210px}.hero h1{font-size:39px;margin-top:120px}.hero .iam{font-size:17px;letter-spacing:5px}.hero p{font-size:17px}.content:before{font-size:270px}.composer-wrap{left:0;padding:0 8px 10px}.composer{border-radius:30px;padding:8px 10px}.compose-inner{gap:4px}.tool{width:43px;height:43px;flex-basis:43px;font-size:26px}.voice:after{font-size:30px}.send{width:43px;height:43px;font-size:32px}textarea{font-size:16px;min-height:48px;padding:13px 4px}.nav{padding-top:8px}.sigil{margin-top:40px}.menu{top:65px;right:8px;width:calc(100% - 16px)}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">⛧</div><div class="brand-text"><div class="title">LuciChat</div><div class="tag">Your Satanist AI Assistant</div></div></div>
  <div class="top"><button class="persona" id="personaBtn">Satanist Luci　⌄</button><button class="dots" id="menuBtn" aria-label="Menu">⋮</button></div>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <nav class="nav">
      <button class="active" data-view="chat"><span class="ico">◌</span><span>Chat</span></button>
      <button data-view="image"><span class="ico">▧</span><span>Image Generator</span></button>
      <button data-view="lore"><span class="ico">♧</span><span>Satanic Lore</span></button>
      <button data-view="settings"><span class="ico">⚙</span><span>Settings</span></button>
    </nav>
    <div class="sigil"></div>
    <div class="side-quote">Knowledge<br>is power</div><div class="cross"></div><div class="side-quote">and power<br>is freedom</div><div class="cross"></div>
  </aside>
  <section class="content">
    <div class="hero" id="hero">
      <h1>Welcome to LuciChat</h1>
      <div class="iam">I AM SATANIST LUCI</div>
      <div class="divider"></div>
      <p>Ask me about <strong>Satanism, its history, symbolism, philosophy,</strong> and related topics. I'm here to help, guide, and share knowledge — without judgment.</p>
    </div>
    <div id="chat"></div>
  </section>
</div>
<div class="composer-wrap"><div class="composer"><div class="compose-inner"><button class="tool imagebtn" id="imageBtn" title="Image Generator" aria-label="Image Generator">▧</button><button class="tool voice" id="voiceBtn" title="Voice input" aria-label="Voice input">Voice</button><textarea id="input" rows="1" placeholder="Message LuciChat..." aria-label="Message LuciChat"></textarea><button class="send" id="send" title="Send" aria-label="Send"></button></div><div class="status" id="status"></div></div></div>
<div class="menu" id="menu"><h2>⛧ LuciChat</h2><button id="newChatBtn">New Chat</button><button id="menuImageBtn">Image Generator</button><button id="menuLoreBtn">Satanic Lore</button><button id="menuSettingsBtn">Settings</button><button class="close" id="closeMenu">Close</button></div>
<script>
const TEXT_ENDPOINT='https://text.pollinations.ai/';
const TEXT_MODEL='openai-fast';
const IMAGE_ENDPOINT='https://image.pollinations.ai/prompt/';
const input=document.getElementById('input'),send=document.getElementById('send'),chat=document.getElementById('chat'),hero=document.getElementById('hero'),status=document.getElementById('status'),sidebar=document.getElementById('sidebar'),menu=document.getElementById('menu'),menuBtn=document.getElementById('menuBtn'),imageBtn=document.getElementById('imageBtn'),voiceBtn=document.getElementById('voiceBtn');
let messages=[];
try{messages=JSON.parse(localStorage.getItem('lucichat_messages')||'[]')}catch(e){messages=[]}
const systemPrompt='You are LuciChat, also called Satanist Luci, a fictional dark-themed AI assistant. Use a calm, gothic, intelligent voice. Discuss Satanism, its history, philosophy, symbolism, mythology, literature, and related topics factually and respectfully. Clearly distinguish historical facts, religious beliefs, modern movements, and fiction. Do not claim to literally be Satan, a demon, or a supernatural being. Do not give dangerous instructions. Be helpful, concise, and safe.';
function save(){localStorage.setItem('lucichat_messages',JSON.stringify(messages))}
function render(){chat.innerHTML='';hero.style.display=messages.length?'none':'block';for(const m of messages){const box=document.createElement('div');box.className='msg '+(m.role==='user'?'user':'ai');const who=document.createElement('div');who.className='who';who.textContent=m.role==='user'?'You':'LuciChat';box.append(who);if(m.image){const p=document.createElement('div');p.textContent=m.content||'Generated image';box.append(p);const img=document.createElement('img');img.className='aiimg';img.loading='lazy';img.src=m.image;img.alt=m.content||'Generated image';box.append(img)}else{const text=document.createElement('div');text.textContent=m.content;box.append(text)}chat.append(box)}window.scrollTo(0,document.body.scrollHeight)}
function add(role,content,extra={}){messages.push({role,content,...extra});save();render()}
function looksLikeImageRequest(t){return /\b(generate|create|draw|make|show|design)\b.{0,40}\b(image|picture|photo|art|drawing|portrait|wallpaper|logo)\b/i.test(t)||/\b(image|picture|photo|art|drawing|portrait|wallpaper)\b.{0,30}\b(of|for)\b/i.test(t)}
function imagePrompt(t){return t.replace(/\b(please|can you|could you|generate|create|draw|make|show me|an image|a picture|a photo)\b/gi,' ').replace(/\s+/g,' ').trim()||'a dark gothic symbol in crimson and black, detailed digital art'}
function generateImage(prompt){const clean=imagePrompt(prompt);const url=IMAGE_ENDPOINT+encodeURIComponent(clean)+'?model=flux&width=768&height=768&nologo=true';add('assistant','Generated image: '+clean,{image:url});status.textContent='Image generated';setTimeout(()=>status.textContent='',1600)}
async function sendMessage(){const text=input.value.trim();if(!text||send.disabled)return;input.value='';input.style.height='auto';add('user',text);send.disabled=true;status.textContent='Working...';try{if(looksLikeImageRequest(text)){generateImage(text);return}const temp={role:'assistant',content:''};messages.push(temp);render();const recent=messages.slice(-9,-1).map(m=>(m.role==='user'?'User: ':'LuciChat: ')+m.content).join('\n');const prompt=systemPrompt+'\n\nRecent conversation:\n'+recent+'\n\nUser: '+text+'\nLuciChat:';const url=TEXT_ENDPOINT+encodeURIComponent(prompt)+'?model='+encodeURIComponent(TEXT_MODEL);const res=await fetch(url,{headers:{Accept:'text/plain'}});if(!res.ok)throw new Error('AI service returned '+res.status);temp.content=(await res.text()).trim()||'I did not receive a response. Try again.';save();render();status.textContent=''}catch(err){if(messages.at(-1)?.role==='assistant'&&!messages.at(-1).content)messages.pop();save();render();status.textContent='Could not generate a response right now.';console.error(err)}finally{send.disabled=false;input.focus()}}
function newChat(){messages=[];save();render();input.value='';input.style.height='auto';menu.classList.remove('open');sidebar.classList.remove('open');status.textContent='New chat started';setTimeout(()=>status.textContent='',1200);input.focus()}
function showSection(name){menu.classList.remove('open');sidebar.classList.remove('open');if(name==='chat'){hero.style.display=messages.length?'none':'block';status.textContent='Chat';setTimeout(()=>status.textContent='',1000)}else if(name==='image'){input.value='Generate an image of ';input.focus();status.textContent='Image Generator ready';setTimeout(()=>status.textContent='',1200)}else if(name==='lore'){input.value='Tell me about Satanic history and philosophy';input.focus();status.textContent='Satanic Lore ready';setTimeout(()=>status.textContent='',1200)}else if(name==='settings'){status.textContent='LuciChat uses the dark Satanist Luci persona by default. No Normal AI mode.';setTimeout(()=>status.textContent='',2200)}}
menuBtn.addEventListener('click',()=>menu.classList.toggle('open'));
document.getElementById('personaBtn').addEventListener('click',()=>menu.classList.toggle('open'));
document.getElementById('closeMenu').addEventListener('click',()=>menu.classList.remove('open'));
document.getElementById('newChatBtn').addEventListener('click',newChat);
document.getElementById('menuImageBtn').addEventListener('click',()=>showSection('image'));
document.getElementById('menuLoreBtn').addEventListener('click',()=>showSection('lore'));
document.getElementById('menuSettingsBtn').addEventListener('click',()=>showSection('settings'));
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');showSection(b.dataset.view)}));
imageBtn.addEventListener('click',()=>{const q=input.value.trim();if(!q){input.value='Generate an image of ';input.focus();return}generateImage(q);input.value='';input.style.height='auto'});
send.addEventListener('click',sendMessage);
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=null;if(SpeechRecognition){recognition=new SpeechRecognition();recognition.lang='en-US';recognition.interimResults=false;recognition.continuous=false;recognition.onstart=()=>{voiceBtn.classList.add('active');status.textContent='Listening...'};recognition.onresult=e=>{input.value=e.results[0][0].transcript;input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px';status.textContent='Voice captured';input.focus();setTimeout(()=>status.textContent='',1200)};recognition.onerror=e=>{status.textContent=e.error==='not-allowed'?'Microphone permission was blocked.':'Voice input failed.'};recognition.onend=()=>voiceBtn.classList.remove('active');voiceBtn.addEventListener('click',()=>{try{recognition.start()}catch(e){recognition.stop()}})}else{voiceBtn.disabled=true;voiceBtn.title='Voice input is not supported in this browser'}
render();
</script>
</body>
</html>
